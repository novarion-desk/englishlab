<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishLab</title>
<meta name="theme-color" content="#312E81">
<style>

:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e1d8;--accent:#2f5bea;--ok:#1a8a4a;--okbg:#e7f6ee;--bad:#c93c3c;--badbg:#fdeceb;--warn:#a1650f;--warnbg:#fdf3e1;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn-link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px}
.btn-link:hover{background:rgba(47,91,234,.08)}
.btn-link.sm{font-size:14px;padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--ink)}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 13%,#fff)}
.links{margin-top:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--muted);font-size:14px}
.mode.on{border-color:var(--accent);background:#eef2fe}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.count-in{width:5.5em;border:2px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:600}
.count-in.on{border-color:var(--accent);background:#eef2fe}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:#cfd4dc;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.primary{display:block;width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;padding:14px;border-radius:12px}
.primary:hover{filter:brightness(1.07)}
.primary:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.5em}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.bar{height:8px;background:#e6e3da;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.instr{font-weight:700;margin:0 0 14px;font-size:18px}
.sentence{font-size:22px;line-height:1.9;margin:6px 0 14px}
.sentence input{font:inherit;font-size:20px;border:0;border-bottom:3px solid var(--accent);background:#f1f4fe;padding:2px 6px;border-radius:6px 6px 0 0;min-width:6ch;max-width:100%;color:var(--ink)}
.sentence input:focus{outline:none;background:#e6ecfd}
.hint{color:var(--muted);font-size:18px;white-space:nowrap}
.tt{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 80%,#000);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
.src{font-size:21px;background:#f7f6f2;border-left:4px solid var(--line);padding:10px 14px;border-radius:8px;margin-bottom:10px}
.sig{margin:0 0 12px;color:var(--muted)}
.sig b{color:var(--ink)}
textarea.full{width:100%;font:inherit;font-size:20px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:3.2em}
textarea.full:focus{outline:none;border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:700;color:var(--ink)}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--okbg)}
.opts button.wrong{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
mark{background:#fff0a8;padding:0 3px;border-radius:4px}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:16px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.warn{background:var(--warnbg)}
.fbt{font-weight:800;font-size:18px;margin-bottom:4px}
.fb.ok .fbt{color:var(--ok)}.fb.bad .fbt{color:var(--bad)}.fb.warn .fbt{color:var(--warn)}
.sol{font-size:18px;margin:6px 0}
.rule{margin-top:8px}
.tip{margin-top:8px;font-weight:600}
.actions{margin-top:16px}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1.1}
.big small{display:block;font-size:17px;color:var(--muted);font-weight:600}
.stat{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.stat .track{height:10px;background:#eee;border-radius:99px;overflow:hidden}
.stat .track div{height:100%}
.mist{border-top:1px solid var(--line);padding:10px 0;font-size:16px}
.mist .you{color:var(--bad)}
.btns{display:grid;gap:10px}
.secondary{width:100%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:17px;padding:12px;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(20,24,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:10}
.modal.hidden{display:none}
.modal .card{max-width:720px;width:100%}
.rt{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rt p{margin:4px 0}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fs{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;color:var(--ink);min-width:44px}
.fs:hover{border-color:var(--accent)}
.fs:disabled{opacity:.35;cursor:default}
.name{display:block;width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;border:0;border-bottom:2px dashed var(--line);padding:6px;margin-bottom:12px;color:var(--ink)}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.center{text-align:center}.muted{color:var(--muted)}
.shot{text-align:center;background:#f1f4fe;border-radius:10px;padding:8px 10px;margin:12px 0 0;font-weight:600}
details.all summary{cursor:pointer;font-weight:700;padding:2px 0}
details.all[open] summary{margin-bottom:8px}
.mist.r-bad{background:var(--badbg);border-radius:8px;padding:10px;margin:6px 0;border:0}
.mist.r-ok{border-top:1px solid var(--line)}
.okc{color:var(--ok);font-weight:600}
.info{background:#f7f6f2;border-radius:10px;padding:12px 14px;margin:10px 0 4px;font-size:15px}
.info p{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
header{flex-wrap:wrap;gap:8px}
.lang{border-width:2px}.lang button{padding:4px 10px;font-size:14px;font-weight:800}
/* Verbliste */
.vtools{position:sticky;top:-20px;background:#fff;padding:4px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:6px}
.vsearch{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}
.vsearch:focus{outline:none;border-color:var(--accent)}
.vrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vseg button{padding:5px 12px;font-size:14px}
.vcount{color:var(--muted);font-size:14px}
.vsec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:16px 0 4px}
.vlegend{font-size:13px;color:var(--muted);margin:0 0 6px}
.vt{width:100%;border-collapse:collapse;font-size:16px}
.vt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.vt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vt tr:nth-child(even) td{background:#faf9f6}
.vt td.b{font-weight:800}
.vt td.de{color:var(--muted);font-size:15px}
.vt td.f{color:#1d3fb3;font-weight:600}
.vtag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.vtag.dbl,.vtag.y{background:var(--warnbg);color:var(--warn)}
.vtag.e{background:#eef0f3;color:#5b6475}
.vt mark{padding:0 1px}
@media (max-width:560px){.vt thead th:last-child{display:none}.vt th{padding:6px}.vt tr{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}.vt td{border:0;padding:4px 6px}.vt td.de{grid-column:1/-1;padding-top:0}}
@media (max-width:520px){.sentence{font-size:19px}.opts{grid-template-columns:1fr}.stat{grid-template-columns:120px 1fr 40px}}

/* ---- Arbeitsblatt (Vorschau + Druck) ---- */
.sheetbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sheetbar button{flex:1;min-width:130px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:16px;color:#111;font-size:15px;line-height:1.45}
.sheet h1{font-size:1.3em;margin:0 0 2px}
.sheet .sub{color:#555;font-size:.9em;margin:0 0 10px}
.sheet .meta{display:flex;gap:24px;margin:10px 0 16px}
.sheet .meta span{flex:1;border-bottom:1px solid #333;padding-bottom:2px;font-size:.9em;color:#444}
.sheet .t{break-inside:avoid;margin:0 0 14px}
.sheet .t .n{font-weight:700;margin-right:6px}
.sheet .t .ins{font-size:.82em;color:#555;margin-bottom:2px}
.sheet .blank{display:inline-block;border-bottom:1.5px solid #222;height:1.05em;vertical-align:baseline}
.sheet .wl{border-bottom:1px solid #999;height:1.9em}
.sheet .opt{display:inline-block;margin-right:14px;white-space:nowrap}
.sheet .box{display:inline-block;width:.8em;height:.8em;border:1.5px solid #222;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sheet .hint{color:#555}
.sheet .sol-list{columns:1}
.sheet .sol-list div{break-inside:avoid;margin:0 0 5px}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff;font-size:12pt}
 header,footer,.sheetbar,.modal{display:none!important}
 .wrap{max-width:none;padding:0}
 .sheet{border:0;border-radius:0;padding:0;margin:0;font-size:12pt}
 .sheet.sol{break-before:page}
}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:block;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;color:var(--ink);text-decoration:none}
.tile:hover:not(.soon){border-color:var(--accent)}
.tile b{display:block;font-size:19px;margin-bottom:2px}
.tile small{color:var(--muted);font-size:14px}
.tile .ic{font-size:28px;display:block;margin-bottom:6px}
.tile.soon{opacity:.55;cursor:default}
.tile .badge{float:right;font-size:12px;font-weight:700;background:#eef0f5;color:var(--muted);border-radius:99px;padding:2px 8px}
.wb{display:inline-flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.wb button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:19px;color:var(--ink)}
.wb button:disabled{opacity:.3}
.built{min-height:3.2em;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.built button{border:2px solid var(--accent);background:#eef2fe;border-radius:10px;padding:6px 12px;font-weight:700;font-size:19px;color:var(--ink)}
.rl{margin:0;padding:0;list-style:none}
.rl li{padding:10px 0;border-bottom:1px solid var(--line)}
.rl li:last-child{border:0}
.rl em{color:#1d4ed8;font-style:normal;font-weight:600}
.err2{color:var(--bad)}
mark.t{background:#fff1b8;padding:0 4px;border-radius:4px;font-weight:700}
.sheet mark.t{background:none;text-decoration:underline;font-weight:700}
.sheet .wbx{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.sheet .wbx span{border:1px solid #888;border-radius:6px;padding:1px 8px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" id="logoLink" href="#" style="text-decoration:none;color:inherit">English<span>Lab</span></a>
    <div class="hdr-r">
      <div class="seg lang" id="langSeg" role="group" aria-label="Sprache / Language"><button data-l="de">DE</button><button data-l="en">EN</button></div>
      <button class="fs" id="fsMinus" aria-label="A−">A−</button>
      <button class="fs" id="fsPlus" aria-label="A+">A+</button>
      <button class="btn-link" id="rulesBtn" style="display:none">📘 Rules</button>
      <button class="btn-link" id="feedbackBtn">💬 Feedback</button>
    </div>
  </header>
  <main id="app"></main>
  <footer>EnglishLab</footer>
</div>
<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>
<script>
const APP_VERSION='0.1';
let LANG='de';try{const l=localStorage.getItem('el-lang');if(l==='de'||l==='en')LANG=l}catch(e){}
const L=(de,en)=>LANG==='de'?de:en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nrm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim();
const app=document.getElementById('app'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');

/* ===== Daten: Frage und Verneinung ===== */
const SUBJ=[
 {t:'I',th:0,ans:'I',nq:1},{t:'you',th:0,ans:'I'},{t:'he',th:1,ans:'he'},{t:'she',th:1,ans:'she'},{t:'we',th:0,ans:'we',ns:1},{t:'they',th:0,ans:'they'},
 {t:'Tom',th:1,ans:'he',who:1},{t:'Anna',th:1,ans:'she',who:1},{t:'my brother',th:1,ans:'he',who:1},{t:'my sister',th:1,ans:'she',who:1},
 {t:'the teacher',th:1,ans:'he',who:1},{t:'my parents',th:0,ans:'they',who:1},{t:'our neighbours',th:0,ans:'they',who:1}
];
const V=(i,s,p,objs)=>({i,s,p,objs:objs.map(o=>{const k=o[0];return {k,o:o.slice(2)}})});
// Objekt: "w:" = was (What), "p:" = wo/wohin (Where), "n:" = keine Wh-Frage
const VERBS=[
 V('play','plays','played',['w:football','w:the guitar','w:computer games','w:tennis']),
 V('watch','watches','watched',['w:TV','w:a film','w:YouTube videos']),
 V('like','likes','liked',['w:pizza','w:pasta','w:this song']),
 V('eat','eats','ate',['w:breakfast','w:an apple','w:pizza']),
 V('read','reads','read',['w:a book','w:the news','w:comics']),
 V('drink','drinks','drank',['w:tea','w:milk','w:water']),
 V('buy','buys','bought',['w:a new phone','w:bread','w:a ticket']),
 V('see','sees','saw',['w:a film','w:your friends']),
 V('write','writes','wrote',['w:emails','w:a letter','w:a story']),
 V('make','makes','made',['w:lunch','w:a cake','w:a video']),
 V('have','has','had',['w:a dog','w:a bike','w:two brothers']),
 V('listen','listens','listened',['n:to music','n:to the radio','n:to podcasts']),
 V('live','lives','lived',['p:in Zurich','p:in a small town','p:near the station']),
 V('work','works','worked',['p:in a shop','p:in a hospital','p:at a bank']),
 V('study','studies','studied',['w:English','w:French','n:for the test']),
 V('go','goes','went',['p:to school','p:to the cinema','p:to the gym']),
 V('walk','walks','walked',['p:to school','p:in the park']),
 V('swim','swims','swam',['p:in the lake','p:in the pool']),
 V('meet','meets','met',['w:friends','w:my cousins']),
 V('call','calls','called',['w:a friend','w:the doctor','w:the dentist']),
 V('help','helps','helped',['w:a classmate','w:our neighbour']),
 V('cook','cooks','cooked',['w:dinner','w:pasta','w:a big meal']),
 V('sing','sings','sang',['w:a song','p:in the choir']),
 V('take','takes','took',['w:the bus','w:photos']),
 V('visit','visits','visited',['w:our grandparents','w:a museum'])
];
const TM={PS:['every day','on Saturdays','every morning','at the weekend','after school'],PaS:['yesterday','last week','last night','two days ago','on Saturday']};
const TNAME={PS:'Present Simple',PaS:'Past Simple'};

/* ===== Texte ===== */
const RULES=()=>[
 [L('Hilfsverb do / does / did','Auxiliary do / does / did'),L('Im Present Simple und Past Simple braucht jede Frage und Verneinung ein Hilfsverb. Danach steht das Verb in der Grundform.','In the Present Simple and Past Simple, every question and negative needs an auxiliary. The verb after it stays in the base form.'),'Does she like pizza? – She doesn\'t like pizza. – Did you see him? – I didn\'t see him.'],
 [L('does nur bei he / she / it','does only with he / she / it'),L('Nach does steht kein -s am Verb.','There is no -s on the verb after does.'),'He plays – Does he play? (not: Does he plays?)'],
 [L('Ausnahme: be, can, must, should, will','Exception: be, can, must, should, will'),L('Diese Verben brauchen kein do. Frage durch Umstellen, Verneinung mit not.','These verbs need no do. Questions by swapping, negatives with not.'),'Is she tired? – She isn\'t tired. – Can you swim?'],
 [L('Fragewort + Hilfsverb + Subjekt + Verb','Question word + auxiliary + subject + verb'),'','Where does he live? – What did you do? – Why are they late?'],
 [L('Fragen nach dem Subjekt (who / what)','Questions about the subject (who / what)'),L('Hier steht kein do.','There is no do here.'),'Who lives here? – What happened?'],
 [L('Present Continuous','Present Continuous'),L('Frage durch Umstellen von be, Verneinung mit not.','Questions by swapping be, negatives with not.'),'Are you listening? – He isn\'t working.'],
 [L('Kurzantworten','Short answers'),L('Sie wiederholen das Hilfsverb.','They repeat the auxiliary.'),'Yes, I do. – No, she doesn\'t. – Yes, he was.'],
 [L('Typische Fehler','Typical mistakes'),'','<span class="err2">Do he like…? / He doesn\'t likes… / Did you saw…? / You like pizza?</span>']
];
const TOPICS=[
 {id:'q',ic:'❓',name:()=>L('Fragen & Verneinung','Questions & negatives'),desc:()=>L('do / does / did, Wortstellung, Kurzantworten','do / does / did, word order, short answers'),ready:1},
 {id:'modals',ic:'🔒',name:()=>L('Modalverben','Modal verbs'),desc:()=>'can, must, should, have to'},
 {id:'comp',ic:'📏',name:()=>L('Vergleichsformen','Comparatives & superlatives'),desc:()=>'bigger, the biggest, more interesting'},
 {id:'quant',ic:'🥛',name:()=>L('Mengenwörter','Quantifiers'),desc:()=>'some / any, much / many, a few / a little'},
 {id:'prep',ic:'📍',name:()=>L('Präpositionen','Prepositions'),desc:()=>'in / on / at, to / into'}
];
const TYPES=()=>[
 {k:'fill',icon:'✏️',label:L('Einsetzen','Fill in'),desc:L('do / does / did einsetzen','fill in do / does / did')},
 {k:'choice',icon:'✔️',label:L('Auswählen','Choose'),desc:L('den richtigen Satz wählen','pick the correct sentence')},
 {k:'question',icon:'❓',label:L('Frage bilden','Make a question'),desc:L('Aussage → Frage','statement → question')},
 {k:'neg',icon:'🚫',label:L('Verneinen','Make negative'),desc:L('Aussage → Verneinung','statement → negative')},
 {k:'order',icon:'🔀',label:L('Satz ordnen','Word order'),desc:L('Wörter in die richtige Reihenfolge','put the words in order')},
 {k:'short',icon:'💬',label:L('Kurzantwort','Short answer'),desc:L('Yes, he does. / No, he doesn\'t.','Yes, he does. / No, he doesn\'t.')},
 {k:'whq',icon:'🔎',label:L('Fragewort (A)','Question word (A)'),desc:L('What / Where / Who fragen','ask with What / Where / Who'),A:1}
];
const ALL_TYPES=['fill','choice','question','neg','order','short','whq'];

/* ===== Aufgaben erzeugen ===== */
let S={tenses:['PS','PaS'],types:['fill','choice','question','neg'],count:10,lvl:'B'};
const effTenses=()=>S.lvl==='C'?['PS']:(S.tenses.length?S.tenses:['PS']);
const effTypes=()=>{let t=S.types.filter(x=>x!=='whq'||S.lvl==='A');return t.length?t:['fill']};
function rec(noI,noWe){
 const p=rnd(VERBS),o=rnd(p.objs),t=rnd(effTenses());
 const pool=SUBJ.filter(s=>!(noI&&s.nq)&&!(noWe&&s.ns));
 const subj=rnd(pool);
 const tm=(t==='PaS'||Math.random()<.5)?rnd(TM[t]):'';
 return {v:p,o,t,S:subj,tm};
}
const vf=r=>r.t==='PaS'?r.v.p:(r.S.th?r.v.s:r.v.i);
const aux=r=>r.t==='PaS'?'did':(r.S.th?'does':'do');
const tmS=r=>r.tm?' '+r.tm:'';
const stmt=r=>cap(r.S.t)+' '+vf(r)+' '+r.o.o+tmS(r)+'.';
const negB=(r,full)=>{const a=aux(r);return cap(r.S.t)+' '+(full?a+' not':a+"n't")+' '+r.v.i+' '+r.o.o+tmS(r)+'.'};
const ques=r=>cap(aux(r))+' '+r.S.t+' '+r.v.i+' '+r.o.o+tmS(r)+'?';
const why={
 q:()=>L('<b>Frage:</b> do / does / did + Subjekt + Verb in der Grundform. Am Verb steht kein -s und kein -ed.','<b>Question:</b> do / does / did + subject + base verb. No -s or -ed on the verb.'),
 n:()=>L('<b>Verneinung:</b> don\'t / doesn\'t / didn\'t + Verb in der Grundform. Am Verb steht kein -s und kein -ed.','<b>Negative:</b> don\'t / doesn\'t / didn\'t + base verb. No -s or -ed on the verb.'),
 s:()=>L('<b>Kurzantwort:</b> Yes / No + Pronomen + Hilfsverb (do, does, did). Das Verb wird nicht wiederholt.','<b>Short answer:</b> Yes / No + pronoun + auxiliary (do, does, did). The verb is not repeated.'),
 w:()=>L('<b>Fragewort:</b> Fragewort + do / does / did + Subjekt + Grundform. Fragt man nach dem Subjekt (who), steht kein do: <i>Who plays football?</i>','<b>Question word:</b> question word + do / does / did + subject + base verb. Asking for the subject (who) takes no do: <i>Who plays football?</i>')
};
function genFill(){
 const r=rec(1),neg=Math.random()<.5;
 if(neg){
  const a=aux(r),full=a+' not',con=a==='does'?"doesn't":a==='do'?"don't":"didn't";
  return {type:'fill',before:cap(r.S.t)+' ',after:' '+r.v.i+' '+r.o.o+tmS(r)+'.',answers:[con,full],hint:L('verneint','negative'),sol:con,why:why.n()};
 }
 const a=cap(aux(r));
 return {type:'fill',before:'',after:' '+r.S.t+' '+r.v.i+' '+r.o.o+tmS(r)+'?',answers:[a],hint:L('Frage','question'),sol:a,why:why.q()};
}
function genChoice(){
 const neg=Math.random()<.5,r=rec(1),a=aux(r);
 let ok,w=[];
 if(!neg){
  ok=ques(r);
  const wa=a==='did'?'Does':(r.S.th?'Do':'Does');
  w.push(wa+' '+r.S.t+' '+r.v.i+' '+r.o.o+tmS(r)+'?');
  w.push(cap(a)+' '+r.S.t+' '+(r.t==='PaS'?r.v.p:r.v.s)+' '+r.o.o+tmS(r)+'?');
  w.push(cap(r.S.t)+' '+vf(r)+' '+r.o.o+tmS(r)+'?');
 }else{
  ok=negB(r,false);
  const wa=a==='did'?"doesn't":(r.S.th?"don't":"doesn't");
  w.push(cap(r.S.t)+' '+wa+' '+r.v.i+' '+r.o.o+tmS(r)+'.');
  w.push(cap(r.S.t)+' '+a+"n't "+(r.t==='PaS'?r.v.p:r.v.s)+' '+r.o.o+tmS(r)+'.');
  w.push(cap(r.S.t)+' not '+vf(r)+' '+r.o.o+tmS(r)+'.');
 }
 w=[...new Set(w)].filter(x=>x!==ok);
 const opts=shuffle([ok,...shuffle(w).slice(0,2)]);
 return {type:'choice',opts,correct:opts.indexOf(ok),instr:neg?L('Welcher Satz ist eine richtige Verneinung?','Which sentence is a correct negative?'):L('Welche Frage ist richtig?','Which question is correct?'),sol:ok,why:neg?why.n():why.q()};
}
function genQuestion(){
 const r=rec(1);
 return {type:'text',src:esc(stmt(r)),instr:L('Mach eine Frage aus dem Satz (Ja/Nein-Frage).','Make a yes/no question from the sentence.'),answers:[ques(r)],sol:ques(r),why:why.q()};
}
function genNeg(){
 const r=rec(0);
 return {type:'text',src:esc(stmt(r)),instr:L('Verneine den Satz.','Make the sentence negative.'),answers:[negB(r,false),negB(r,true)],sol:negB(r,false),why:why.n()};
}
function genOrder(){
 const r=rec(1),q=ques(r);
 const words=q.split(' ');
 return {type:'order',words:shuffle(words),instr:L('Ordne die Wörter zu einer Frage.','Put the words in order to make a question.'),answers:[q],sol:q,why:why.q()};
}
function genShort(){
 const r=rec(1,1),yes=Math.random()<.5,a=aux(r),aw=cap(a);
 const q=ques(r),ans=(yes?'Yes, '+r.S.ans+' '+a+'.':'No, '+r.S.ans+' '+a+"n't.");
 const full=(yes?null:'No, '+r.S.ans+' '+a+' not.');
 return {type:'text',src:esc(q),instr:L('Antworte mit einer Kurzantwort: ','Give a short answer: ')+(yes?'<b>Yes</b>':'<b>No</b>'),answers:[ans,...(full?[full]:[])],sol:ans,why:why.s()};
}
function genWhq(){
 const kind=rnd(['w','p','who']);
 let r,src,ans,w,sol;
 for(let i=0;i<30;i++){
  r=rec(1);
  if(kind==='who'&&!r.S.who)continue;
  if(kind==='w'&&r.o.k!=='w')continue;
  if(kind==='p'&&r.o.k!=='p')continue;
  break;
 }
 if(kind==='who'&&!r.S.who)r.S=rnd(SUBJ.filter(s=>s.who));
 if(kind==='w'&&r.o.k!=='w'){r.v=VERBS[0];r.o=r.v.objs[0]}
 if(kind==='p'&&r.o.k!=='p'){r.v=VERBS.find(v=>v.i==='live');r.o=r.v.objs[0]}
 if(kind==='who'){
  const pl=!r.S.th;const f=r.t==='PaS'?r.v.p:(pl?r.v.i:r.v.i);
  src='<mark class="t">'+esc(cap(r.S.t))+'</mark> '+esc(r.t==='PaS'?r.v.p:(r.S.th?r.v.s:r.v.i))+' '+esc(r.o.o)+esc(tmS(r))+'.';
  const q='Who '+(r.t==='PaS'?r.v.p:r.v.s)+' '+r.o.o+tmS(r)+'?';
  return {type:'text',src,instr:L('Frage nach dem markierten Teil. Beginne mit <b>Who</b>.','Ask about the highlighted part. Start with <b>Who</b>.'),answers:[q],sol:q,why:why.w()};
 }
 const wh=kind==='w'?'What':'Where';
 src=esc(cap(r.S.t))+' '+esc(vf(r))+' <mark class="t">'+esc(r.o.o)+'</mark>'+esc(tmS(r))+'.';
 const q=wh+' '+aux(r)+' '+r.S.t+' '+r.v.i+tmS(r)+'?';
 return {type:'text',src,instr:L('Frage nach dem markierten Teil. Beginne mit <b>'+wh+'</b>.','Ask about the highlighted part. Start with <b>'+wh+'</b>.'),answers:[q],sol:q,why:why.w()};
}
const GEN={fill:genFill,choice:genChoice,question:genQuestion,neg:genNeg,order:genOrder,short:genShort,whq:genWhq};
function typeSeq(n){const m=effTypes();let bag=[],seq=[];for(let i=0;i<n;i++){if(!bag.length)bag=shuffle(m);let j=0;if(m.length>1&&seq.length&&bag[0]===seq[seq.length-1])j=bag.findIndex(x=>x!==seq[seq.length-1])||0;if(j<0)j=0;seq.push(bag.splice(j,1)[0])}return seq}
const seenG=new Set();
function build(n){
 const out=[],seq=typeSeq(n),seen=new Set();
 for(const t of seq){let it,k=0;do{it=GEN[t]();k++}while((seen.has(it.sol)||seenG.has(it.sol))&&k<40);seen.add(it.sol);seenG.add(it.sol);it.kind=t;out.push(it)}
 return out;
}

/* ===== Zustand / Bildschirme ===== */
let screen='home',topic=null,items=[],idx=0,score=0,results=[],answered=false,infinite=false,built=[],sheetItems=[];
const typeLabel=k=>{const t=TYPES().find(x=>x.k===k);return t?t.icon+' '+t.label:k};
function setHeader(){
 document.getElementById('rulesBtn').style.display=topic?'':'none';document.getElementById('rulesBtn').textContent='📘 '+L('Regeln','Rules');
 document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
}
function renderHome(){
 screen='home';topic=null;setHeader();
 app.innerHTML=`<div class="card"><h2>${L('Thema wählen','Choose a topic')}</h2>
  <div class="tiles">
   <a class="tile" href="https://novarion-desk.github.io/tensetrainer/"><span class="ic">⏱️</span><b>Tense Trainer</b><small>${L('Zeitformen üben (eigene App)','Practise tenses (separate app)')}</small></a>
   ${TOPICS.map(t=>t.ready?`<button class="tile" data-topic="${t.id}"><span class="ic">${t.ic}</span><b>${t.name()}</b><small>${t.desc()}</small></button>`:`<div class="tile soon"><span class="badge">${L('bald','soon')}</span><span class="ic">${t.ic}</span><b>${t.name()}</b><small>${t.desc()}</small></div>`).join('')}
  </div></div>`;
 app.onclick=e=>{const b=e.target.closest('[data-topic]');if(b)openTopic(b.dataset.topic)};
}
function openTopic(id){topic=TOPICS.find(t=>t.id===id);renderSetup()}
function renderSetup(){
 screen='setup';items=[];setHeader();
 const A=S.lvl==='A';
 app.innerHTML=`
 <button class="btn-link" id="homeBtn">‹ ${L('Themen','Topics')}</button>
 <h1 style="margin:6px 0 14px;font-size:24px">${topic.ic} ${topic.name()}</h1>
 <div class="card"><h2>${L('1 · Niveau','1 · Level')}</h2>
  <div class="opt-row"><div class="seg" id="lvlSeg">${[['C',L('C (einfach)','C (easy)')],['B','B'],['A',L('A (anspruchsvoll)','A (demanding)')]].map(([k,l])=>`<button data-lv="${k}" class="${S.lvl===k?'on':''}">${l}</button>`).join('')}</div></div>
  <p class="muted" style="margin:6px 0 0;font-size:.9em">${L('C: nur Present Simple. B: Present und Past Simple. A: zusätzlich Fragewörter (What, Where, Who).','C: Present Simple only. B: Present and Past Simple. A: plus question words (What, Where, Who).')}</p></div>
 <div class="card"><h2>${L('2 · Zeitformen','2 · Tenses')}</h2>
  <div class="chips">${['PS','PaS'].map(k=>`<button class="chip ${effTenses().includes(k)?'on':''}" data-t="${k}" ${S.lvl==='C'&&k==='PaS'?'disabled style="opacity:.4"':''}>${TNAME[k]}</button>`).join('')}</div></div>
 <div class="card"><h2>${L('3 · Übungsart','3 · Exercise type')}</h2>
  <div class="modes">${TYPES().filter(t=>!t.A||A).map(m=>`<button class="mode ${S.types.includes(m.k)?'on':''}" data-m="${m.k}"><b>${m.icon} ${m.label}</b><small>${m.desc}</small></button>`).join('')}</div></div>
 <div class="card"><h2>${L('4 · Anzahl Aufgaben','4 · Number of exercises')}</h2>
  <div class="seg">${[10,15,20,0].map(n=>`<button class="${S.count===n?'on':''}" data-n="${n}">${n||'∞'}</button>`).join('')}</div></div>
 <button class="primary" id="start">${L("Los geht's →","Let's go →")}</button>
 <button class="secondary" id="sheetBtn" style="margin-top:10px">${L('🖨 Arbeitsblatt (Vorschau, PDF / Druck)','🖨 Worksheet (preview, PDF / print)')}</button>
 <p class="err" id="err"></p>`;
 app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='homeBtn')return renderHome();
  if(b.dataset.lv){S.lvl=b.dataset.lv}
  else if(b.dataset.t){const k=b.dataset.t;if(S.lvl==='C')return;S.tenses=S.tenses.includes(k)?S.tenses.filter(x=>x!==k):['PS','PaS'].filter(x=>x===k||S.tenses.includes(x));if(!S.tenses.length)S.tenses=[k==='PS'?'PaS':'PS']}
  else if(b.dataset.m){const k=b.dataset.m;S.types=S.types.includes(k)?S.types.filter(x=>x!==k):ALL_TYPES.filter(x=>x===k||S.types.includes(x))}
  else if(b.dataset.n!==undefined){S.count=+b.dataset.n}
  else if(b.id==='start')return start();
  else if(b.id==='sheetBtn')return openSheet();
  else return;
  renderSetup();
 };
}
function chk(){const err=document.getElementById('err');if(!S.types.filter(x=>x!=='whq'||S.lvl==='A').length){err.textContent=L('Wähle mindestens eine Übungsart.','Choose at least one exercise type.');return false}return true}
function start(){
 if(!chk())return;
 infinite=S.count===0;items=build(infinite?10:S.count);idx=0;score=0;results=[];renderTask();
}
function renderTask(){
 screen='task';const it=items[idx];answered=false;built=[];
 let body='';
 const instr=`<p class="instr">${it.instr||(it.type==='fill'?L('Setze das passende Hilfsverb ein.','Fill in the correct auxiliary.'):'')}</p>`;
 if(it.type==='fill'){
  const w=Math.max(8,it.sol.length+3);
  body=`<p class="instr">${L('Setze das passende Hilfsverb ein.','Fill in the correct auxiliary.')} <span class="hint">(${it.hint})</span></p>
   <div class="sentence">${esc(it.before)}<input class="tin" id="inp" style="width:${w}ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(it.after)}</div>`;
 }else if(it.type==='choice'){
  body=instr+`<div class="opts" style="grid-template-columns:1fr">${it.opts.map((o,i)=>`<button data-o="${i}" style="text-align:left;font-size:18px">${esc(o)}</button>`).join('')}</div>`;
 }else if(it.type==='order'){
  body=instr+`<div class="built" id="built"></div><div class="wb" id="wb">${it.words.map((w,i)=>`<button data-w="${i}">${esc(w)}</button>`).join('')}</div>
   <div><button class="btn-link" id="reset">${L('↺ Zurücksetzen','↺ Reset')}</button></div>`;
 }else{
  body=instr+`<div class="src">${it.src}</div><textarea class="full tin" id="inp" rows="2" placeholder="${L('Schreib den ganzen Satz …','Write the whole sentence …')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>`;
 }
 const auto=(it.type==='choice')?'':`<button class="primary" id="go">${L('Prüfen','Check')}</button>`;
 app.innerHTML=`
 <div class="qtop"><button class="btn-link" id="quit">${infinite?L('✓ Fertig','✓ Done'):L('✕ Beenden','✕ Quit')}</button><span>${infinite?L('Aufgabe ','Exercise ')+(idx+1)+' · ∞':(idx+1)+' / '+items.length}</span><span>⭐ ${score}</span></div>
 ${infinite?'':`<div class="bar"><div style="width:${idx/items.length*100}%"></div></div>`}
 <div class="card"><div class="tag">${typeLabel(it.kind)}</div>${body}<div id="fb"></div><div class="actions">${auto}</div></div>`;
 app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='quit'){
   if(infinite&&results.length)return renderResults();
   if(results.length&&!confirm(L('Runde wirklich beenden?\nDeine bisherigen Antworten gehen verloren.','Really quit this round?\nYour answers so far will be lost.')))return;
   return renderSetup();
  }
  if(b.dataset.o!==undefined&&!answered)return answerChoice(+b.dataset.o);
  if(b.dataset.w!==undefined&&!answered){built.push(it.words[+b.dataset.w]);b.disabled=true;drawBuilt();return}
  if(b.id==='reset'&&!answered){built=[];app.querySelectorAll('#wb button').forEach(x=>x.disabled=false);drawBuilt();return}
  if(b.id==='go')return answered?next():check();
 };
 const inp=document.getElementById('inp');if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();answered?next():check()}}}
}
function drawBuilt(){const el=document.getElementById('built');if(el)el.innerHTML=built.map(w=>`<button disabled>${esc(w)}</button>`).join('')}
function done(ok,val){
 const it=items[idx];answered=true;if(ok)score++;
 results.push({it,ok,val});
 const fb=document.getElementById('fb');
 fb.innerHTML=ok?`<div class="fb ok"><div class="fbt">${L('Richtig!','Correct!')}</div></div>`:`<div class="fb bad"><div class="fbt">${L('Nicht ganz.','Not quite.')}</div>${L('Richtig wäre:','Correct:')} <b>${esc(it.sol)}</b><div class="rule">${it.why}</div></div>`;
 const go=document.getElementById('go');
 const last=!infinite&&idx===items.length-1;
 const lab=last?L('Ergebnis','Results'):L('Weiter →','Next →');
 if(go){go.textContent=lab}else{document.querySelector('.actions').innerHTML=`<button class="primary" id="go">${lab}</button>`}
 const inp=document.getElementById('inp');if(inp)inp.readOnly=true;
}
function check(){
 const it=items[idx];let val;
 if(it.type==='order'){val=built.join(' ');if(!built.length)return}
 else{const inp=document.getElementById('inp');val=inp.value;if(!val.trim()){inp.focus();return}}
 const ok=it.answers.some(a=>nrm(a)===nrm(val));
 done(ok,val);
}
function answerChoice(i){

 app.querySelectorAll('[data-o]').forEach((b,j)=>{b.disabled=true;if(j===it.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
 done(i===it.correct,it.opts[i]);
}
function next(){idx++;if(!infinite&&idx>=items.length)return renderResults();if(infinite&&idx>=items.length)items.push(...build(5));renderTask()}

 screen='results';const n=results.length,pct=n?Math.round(score/n*100):0;
 const wrong=results.filter(r=>!r.ok);
 app.innerHTML=`<div class="card"><div class="big">${score} / ${n}<small>${pct} %</small></div></div>
 ${wrong.length?`<div class="card"><h2>${L('Zum Nachschauen','To review')}</h2><ul class="rl">${wrong.map(r=>`<li>${r.it.src?'<div class="src" style="font-size:17px">'+r.it.src+'</div>':''}${r.val?`<span class="err2">${esc(r.val)}</span><br>`:''}<b>${esc(r.it.sol)}</b></li>`).join('')}</ul></div>`:''}
 <button class="primary" id="again">${L('Nochmal','Again')}</button>
 <button class="secondary" id="setup" style="margin-top:10px">${L('‹ Einstellungen','‹ Settings')}</button>`;
 app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='again')return start();if(b.id==='setup')return renderSetup()};
}

document.getElementById('langSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;try{localStorage.setItem('el-lang',LANG)}catch(err){}document.documentElement.lang=LANG;redraw()};
function redraw(){setHeader();if(screen==='home')renderHome();else if(screen==='setup')renderSetup();else if(screen==='sheet')renderSheet();else if(screen==='results')renderResults();/* Aufgabe bleibt unverändert */}
document.getElementById('logoLink').onclick=e=>{e.preventDefault();renderHome()};
const FS=[.9,1,1.12,1.25];let fsi=1;
try{const v=+localStorage.getItem('el-fs');if(v>=0&&v<FS.length)fsi=v}catch(e){}
function applyFs(){document.body.style.zoom=FS[fsi];document.getElementById('fsMinus').disabled=fsi===0;document.getElementById('fsPlus').disabled=fsi===FS.length-1;try{localStorage.setItem('el-fs',fsi)}catch(e){}}
document.getElementById('fsMinus').onclick=()=>{if(fsi>0){fsi--;applyFs()}};
document.getElementById('fsPlus').onclick=()=>{if(fsi<FS.length-1){fsi++;applyFs()}};
applyFs();
function openAppFeedback(){var q=new URLSearchParams({app:'englishlab',version:APP_VERSION,geraet:(navigator.userAgent||'').slice(0,120)});window.open('https://tally.so/r/GeR9re?'+q.toString(),'_blank','noopener');}
document.documentElement.lang=LANG;
renderHome();


/* ===== Zurück-Geste (Handy): ein Schritt zurück statt App schliessen ===== */
(function(){
 let depth=0,ign=0,raf=0;
 const isSub=()=>{try{return !!(screen!=='home'||!modal.classList.contains('hidden'))}catch(e){return false}};
 const goBack=()=>{try{if(!modal.classList.contains('hidden')){closeModal()}else if(screen==='home'){}else if(screen==='setup'){renderHome()}else if(screen==='task'&&results.length&&!infinite&&!confirm(L('Runde wirklich beenden?\nDeine bisherigen Antworten gehen verloren.','Really quit this round?\nYour answers so far will be lost.'))){}else{renderSetup()}}catch(e){}};
 function sync(){
  raf=0;const want=isSub();
  if(want&&!depth){history.pushState({sub:1},'');depth=1}
  else if(!want&&depth){depth=0;ign++;history.back()}
 }
 const sched=()=>{if(!raf)raf=requestAnimationFrame(sync)};
 new MutationObserver(sched).observe(document.body,{attributes:true,subtree:true,childList:true,attributeFilter:['class','hidden','style','open']});
 window.addEventListener('popstate',()=>{
  if(ign>0){ign--;return}
  if(depth){depth=0;goBack();sched()}
 });
})();

</script>
</body>
</html>
