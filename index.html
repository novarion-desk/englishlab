<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishLab</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>


:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e1d8;--accent:#2f5bea;--ok:#1a8a4a;--okbg:#e7f6ee;--bad:#c93c3c;--badbg:#fdeceb;--warn:#a1650f;--warnbg:#fdf3e1;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn-link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px}
.btn-link:hover{background:rgba(47,91,234,.08)}
.btn-link.sm{font-size:14px;padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--ink)}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 13%,#fff)}
.links{margin-top:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--muted);font-size:14px}
.mode.on{border-color:var(--accent);background:#eef2fe}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.count-in{width:5.5em;border:2px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:600}
.count-in.on{border-color:var(--accent);background:#eef2fe}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:#cfd4dc;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.primary{display:block;width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;padding:14px;border-radius:12px}
.primary:hover{filter:brightness(1.07)}
.primary:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.5em}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.bar{height:8px;background:#e6e3da;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.instr{font-weight:700;margin:0 0 14px;font-size:18px}
.sentence{font-size:22px;line-height:1.9;margin:6px 0 14px}
.sentence input{font:inherit;font-size:20px;border:0;border-bottom:3px solid var(--accent);background:#f1f4fe;padding:2px 6px;border-radius:6px 6px 0 0;min-width:6ch;max-width:100%;color:var(--ink)}
.sentence input:focus{outline:none;background:#e6ecfd}
.hint{color:var(--muted);font-size:18px;white-space:nowrap}
.tt{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 80%,#000);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
.src{font-size:21px;background:#f7f6f2;border-left:4px solid var(--line);padding:10px 14px;border-radius:8px;margin-bottom:10px}
.sig{margin:0 0 12px;color:var(--muted)}
.sig b{color:var(--ink)}
textarea.full{width:100%;font:inherit;font-size:20px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:3.2em}
textarea.full:focus{outline:none;border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:700;color:var(--ink)}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--okbg)}
.opts button.wrong{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);vertical-align:baseline}
mark{background:#fff0a8;padding:0 3px;border-radius:4px}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:16px}
.kirow{margin-top:10px}
.ki{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f5f3ff;border:1px solid #c4b5fd;color:#2e1065;font-size:16px}
.ki.err{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d}.ki.wait{color:#5b21b6}
.ki .kit{white-space:pre-wrap;margin:6px 0;line-height:1.5}.ki .kin{font-size:13px;opacity:.8}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.warn{background:var(--warnbg)}
.fbt{font-weight:800;font-size:18px;margin-bottom:4px}
.fb.ok .fbt{color:var(--ok)}.fb.bad .fbt{color:var(--bad)}.fb.warn .fbt{color:var(--warn)}
.sol{font-size:18px;margin:6px 0}
.rule{margin-top:8px}
.tip{margin-top:8px;font-weight:600}
.actions{margin-top:16px}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1.1}
.big small{display:block;font-size:17px;color:var(--muted);font-weight:600}
.stat{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.stat .track{height:10px;background:#eee;border-radius:99px;overflow:hidden}
.stat .track div{height:100%}
.mist{border-top:1px solid var(--line);padding:10px 0;font-size:16px}
.mist .you{color:var(--bad)}
.btns{display:grid;gap:10px}
.secondary{width:100%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:17px;padding:12px;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(20,24,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:10}
.modal.hidden{display:none}
.modal .card{max-width:720px;width:100%}
.rt{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rt p{margin:4px 0}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fs{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;color:var(--ink);min-width:44px}
.fs:hover{border-color:var(--accent)}
.fs:disabled{opacity:.35;cursor:default}
.name{display:block;width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;border:0;border-bottom:2px dashed var(--line);padding:6px;margin-bottom:12px;color:var(--ink)}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.center{text-align:center}.muted{color:var(--muted)}
.shot{text-align:center;background:#f1f4fe;border-radius:10px;padding:8px 10px;margin:12px 0 0;font-weight:600}
details.all summary{cursor:pointer;font-weight:700;padding:2px 0}
details.all[open] summary{margin-bottom:8px}
.mist.r-bad{background:var(--badbg);border-radius:8px;padding:10px;margin:6px 0;border:0}
.mist.r-ok{border-top:1px solid var(--line)}
.okc{color:var(--ok);font-weight:600}
.info{background:#f7f6f2;border-radius:10px;padding:12px 14px;margin:10px 0 4px;font-size:15px}
.info p{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
header{flex-wrap:wrap;gap:8px}
.lang{border-width:2px}.lang button{padding:4px 10px;font-size:14px;font-weight:800}
/* Verbliste */
.vtools{position:sticky;top:-20px;background:#fff;padding:4px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:6px}
.vsearch{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}
.vsearch:focus{outline:none;border-color:var(--accent)}
.vrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vseg button{padding:5px 12px;font-size:14px}
.vcount{color:var(--muted);font-size:14px}
.vsec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:16px 0 4px}
.vlegend{font-size:13px;color:var(--muted);margin:0 0 6px}
.vt{width:100%;border-collapse:collapse;font-size:16px}
.vt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.vt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vt tr:nth-child(even) td{background:#faf9f6}
.vt td.b{font-weight:800}
.vt td.de{color:var(--muted);font-size:15px}
.vt td.f{color:#1d3fb3;font-weight:600}
.vtag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.vtag.dbl,.vtag.y{background:var(--warnbg);color:var(--warn)}
.vtag.e{background:#eef0f3;color:#5b6475}
.vt mark{padding:0 1px}
@media (max-width:560px){.vt thead th:last-child{display:none}.vt th{padding:6px}.vt tr{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}.vt td{border:0;padding:4px 6px}.vt td.de{grid-column:1/-1;padding-top:0}}
@media (max-width:520px){.sentence{font-size:19px}.opts{grid-template-columns:1fr}.stat{grid-template-columns:120px 1fr 40px}}

/* ---- Arbeitsblatt (Vorschau + Druck) ---- */
.sheetbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sheetbar button{flex:1;min-width:130px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:16px;color:#111;font-size:15px;line-height:1.45}
.sheet h1{font-size:1.3em;margin:0 0 2px}
.sheet .sub{color:#555;font-size:.9em;margin:0 0 10px}
.sheet .meta{display:flex;gap:24px;margin:10px 0 16px}
.sheet .meta span{flex:1;border-bottom:1px solid #333;padding-bottom:2px;font-size:.9em;color:#444}
.sheet .t{break-inside:avoid;margin:0 0 14px}
.sheet .t .n{font-weight:700;margin-right:6px}
.sheet .t .ins{font-size:.82em;color:#555;margin-bottom:2px}
.sheet .blank{display:inline-block;border-bottom:1.5px solid #222;height:1.05em;vertical-align:baseline}
.sheet .wl{border-bottom:1px solid #999;height:1.9em}
.sheet .opt{display:inline-block;margin-right:14px;white-space:nowrap}
.sheet .box{display:inline-block;width:.8em;height:.8em;border:1.5px solid #222;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sheet .hint{color:#555}
.sheet .sol-list{columns:1}
.sheet .sol-list div{break-inside:avoid;margin:0 0 5px}
/* Karten: Knöpfe, Theorie farbig */
.tile{cursor:pointer}
.tile .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tile .tags .tg{flex:1 1 auto;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.tg{width:auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.tg.th{background:#2563eb;border-color:#2563eb;color:#fff}
.tg.pr{background:#16a34a;border-color:#16a34a;color:#fff}
.tg.sl{background:#fff7e6;border-color:#f59e0b;color:#b45309}
.tg:hover{filter:brightness(.95);transform:translateY(-1px)}
.theory2{display:grid;gap:14px}
.theory2 .rsec{border:0;background:#fff;border-radius:18px;padding:0;overflow:hidden;box-shadow:0 2px 10px rgba(30,41,90,.08);border-left:7px solid var(--c)}
.theory2 .rsec h3{display:flex;align-items:center;gap:10px;margin:0;padding:12px 16px;font-size:20px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff)}
.theory2 .rn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-size:15px;flex:none}
.theory2 .rb{padding:12px 18px 16px;font-size:18px}
.theory2 .rb table th{background:color-mix(in srgb,var(--c) 16%,#fff)}
.theory2 .rb .sl-ex>div{background:#f4f7ff;border-radius:10px;padding:8px 12px;margin:6px 0}
.theory2 .rb .sl-tip{background:#ecfdf5;border-radius:12px;padding:10px 14px}
.theory2 .rb .sl-warn{background:#fff1f2;border-radius:12px;padding:10px 14px}
.theory2 .rex{margin-top:8px;background:#f4f7ff;border-radius:10px;padding:8px 12px;color:#1d4ed8;font-weight:600}
.vlhead,.vmain{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.4fr;gap:6px;align-items:center}
.vlhead{font-size:12px;color:#667;padding:6px 10px;text-transform:uppercase;letter-spacing:.04em}.vlhead *{font-style:normal}
.vlrow{border:2px solid var(--line);border-radius:12px;margin:5px 0;padding:8px 10px;background:#fff;cursor:pointer}
.vlrow.irr .vmain b{color:#2563eb}.vlrow.open{border-color:#2563eb;background:#f4f7ff}
.vmain em{font-style:normal;color:#556;font-size:.92em}
.vdet{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.vdet div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}.vdet small{display:block;color:#667;font-size:11px}.vdet p{flex-basis:100%;margin:2px 0 0;color:#b45309;font-weight:600;font-size:.9em}
/* Reiter */
.ttabs{display:flex;gap:6px;background:#e8ecfa;border-radius:16px;padding:5px;margin:0 0 14px}
.ttabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:11px 8px;font-weight:800;font-size:15px;color:#334;white-space:nowrap}
.ttabs button.on{background:#2563eb;color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.35)}
/* Hub-Karten, Einstellungen, Grafiken */
.hub{border:0!important;color:#fff!important;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))!important;box-shadow:0 6px 18px color-mix(in srgb,var(--c) 35%,transparent)!important;border-radius:20px!important;padding:22px!important}
.hub small{color:rgba(255,255,255,.92)!important}.hub .hic{background:rgba(255,255,255,.25);width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;margin-bottom:6px}
.hub b{font-size:1.35rem!important}
.hub.tch{background:linear-gradient(135deg,#f59e0b,#fbbf24)!important;color:#3b2a00!important}.hub.tch small{color:#5c4300!important}
.mqcfg{border:2px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.mqrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0}.mqrow>span{font-weight:700;color:#667;margin-right:4px;font-size:.8em}
.mchip{width:auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85em;color:var(--ink)}
.mchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.feat{grid-column:1/-1;background:linear-gradient(135deg,#2f5bea,#6d8dff)!important;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;border-top-color:transparent!important}
.tile.feat b,.tile.feat small{color:#fff}.tile.feat .ic{background:rgba(255,255,255,.25);margin:0}.tile.feat b{font-size:22px;margin:0}
.tile.feat .tags{margin:0 0 0 auto}.tile.feat .tg{border-color:#fff}
.bf{display:inline-block;padding:1px 14px;border-radius:999px;color:#fff;font-weight:800}.bf.am,.gap.am,.tb.am{background:#2f5bea}.bf.is,.gap.is,.tb.is{background:#16a34a}.bf.are,.gap.are,.tb.are{background:#f97316}
.bcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.5fr);gap:14px;margin-top:8px}.bcol{border-radius:16px;padding:10px 12px;border:3px solid}.bcol.am{border-color:#2f5bea;background:#eef3ff}.bcol.is{border-color:#16a34a;background:#effbf3}.bcol.are{border-color:#f97316;background:#fff6ee}.bcol h3{display:flex!important;justify-content:center;margin:0 0 6px!important;text-align:center;font-size:1.3em;background:none!important;padding:0!important;border:0!important}.bper{min-width:0;gap:6px}.bper b{white-space:nowrap}.rb .bper small{display:none}@media(max-width:1000px){.bper small{display:none}.bper .ic svg{height:3.6em;width:auto}}@media(max-width:560px){.negwrap{flex-direction:column}.negfig svg{height:7em}.bcols{grid-template-columns:minmax(0,1fr)}}
.bper{display:flex;align-items:center;gap:10px;font-size:1.15em;margin:6px 0;background:#fff;border-radius:12px;padding:5px 10px}.bper .ic{display:inline-flex;flex:none;justify-content:center}.bper .ic svg{height:3em;width:auto}.bper small{margin-left:auto;color:#475569}
.wcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:6px 0}.wc{border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff;text-align:center}.wc .ic{text-align:center;line-height:0}.wc .ic svg{height:5.6em;width:6.22em;display:inline-block;margin:0 0 2px}.cmp svg{height:1.1em;width:auto;vertical-align:-.2em}.idh svg{height:1.8em;width:auto;vertical-align:-.3em}.negwrap{display:flex;gap:16px;align-items:center}.negwrap>.nrows,.negwrap>.errs{flex:1;min-width:0}.negfig{flex:none;text-align:center}.negfig svg{height:9em;width:auto}.errs .errc{font-size:1.02em}.errs+.negfig svg{height:7.5em}.oops{font-weight:800;color:#d97706;margin-top:2px}.bsc svg{width:100%;max-width:120px;height:auto;display:block;margin:6px auto 0}.fcs svg{height:2.3em;width:auto;vertical-align:-.4em;margin:0 3px}.wc .exs{margin-top:4px;color:#1e293b}
@media(max-width:560px){.wcards{grid-template-columns:repeat(2,minmax(0,1fr))}.wc .ic svg{height:4.2em;width:4.67em}}
.cmp{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:10px;font-size:1.05em}.cmp span{padding:6px 12px;border-radius:12px}.cf{background:#fef3c7}.cx{background:#fee2e2}.co{background:#dcfce7}
.nrows{margin:8px 0}.nrow{flex-wrap:wrap;display:flex;align-items:center;gap:10px;font-size:1.25em;margin:8px 0}.nrow .who{min-width:7em;text-align:right}.nrow .not{background:#dc2626;color:#fff;border-radius:8px;padding:1px 10px;font-weight:800}.nrow i{font-style:normal;color:#64748b}
.swp{display:flex;align-items:center;justify-content:center;gap:16px;font-size:1.3em;margin:6px 0 10px}.swp .swa{font-size:1.6em;color:#dc2626}.swp .sent{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 14px}
.qarow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:1.1em}.qq{min-width:9em;font-weight:700}.bb{border-radius:16px;padding:3px 14px;display:inline-block}.bb.y{background:#dcfce7;border:2px solid #16a34a}.bb.n{background:#fee2e2;border:2px solid #dc2626}
.errs{margin-top:6px}.errc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0;font-size:1.2em}.errc .e1{background:#fee2e2;border-radius:12px;padding:6px 12px;color:#991b1b}.errc .e2{background:#dcfce7;border-radius:12px;padding:6px 12px;color:#166534}
.tapq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:1.1em}.tapq .n{font-weight:800;min-width:1.4em;color:var(--accent)}.tapq .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid #94a3b8;border-radius:6px;text-align:center;color:#fff;font-weight:800}.tapq .gap:empty,.tapq .gap{color:#fff}

/* ===== Design 0.3: Schüler-Look ===== */
:root{--bg:#f4f5fb;--accent:#4f46e5;--accent-bg:#eef2ff}
body{background:radial-gradient(1200px 500px at 50% -120px,#e0e7ff 0,transparent 70%),var(--bg)}
.wrap{max-width:900px}
.logo{font-size:26px}
.logo span{background:linear-gradient(90deg,#4f46e5,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
header{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;position:sticky;top:8px;z-index:5}
.btn-link{color:var(--accent)}
.btn-link:hover{background:var(--accent-bg)}
.seg button.on,.primary,.chip.on{background:var(--accent)}
.chip.on{background:var(--accent-bg);border-color:var(--accent)}
.mode.on{border-color:var(--accent);background:var(--accent-bg)}
.opts button:hover:not(:disabled),.wb button:hover:not(:disabled){border-color:var(--accent)}
.bar div{background:var(--accent)}
.secondary{border-color:var(--accent);color:var(--accent)}
.sentence input{border-bottom-color:var(--accent);background:var(--accent-bg)}
.gap{border-bottom-color:var(--accent)}
.built button{border-color:var(--accent);background:var(--accent-bg)}
.card{border-radius:18px;box-shadow:0 2px 10px rgba(30,41,90,.05)}
.hero{text-align:center;padding:26px 10px 10px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.hero p{margin:0 auto 16px;max-width:520px;color:var(--muted)}
.search{width:100%;max-width:440px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:99px;padding:11px 18px;background:#fff}
.search:focus{outline:none;border-color:var(--accent)}
.grp{margin:22px 0 8px}
.grp h2{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.06em;color:var(--c);margin:0 0 10px}
.grp .dot{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);font-size:18px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{position:relative;border:2px solid transparent;border-top:5px solid var(--c,var(--accent));box-shadow:0 2px 8px rgba(30,41,90,.07);transition:transform .12s,box-shadow .12s;background:#fff}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,41,90,.13);border-color:transparent;border-top-color:var(--c,var(--accent))}
.tile .ic{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,#fff);font-size:25px;margin-bottom:8px}

.tile .tags i.tt{background:#fff3d6;color:#8a5a00}
.thead{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));color:#fff;border-radius:20px;padding:20px 22px;margin:6px 0 14px}

(function(){
 /* Pro Ebene ein Verlaufseintrag: Zurückwischen geht immer genau eine Ebene zurück */
 let lv=0,ign=0;
 const level=()=>{try{
  const base=screen==='home'?0:(screen==='prac'||screen==='theory'||screen==='slides'||screen==='setup'||screen==='utest'||screen==='tprep')?1:2;
  return base+((!modal.classList.contains('hidden')||T.pres||document.getElementById('login').open)?1:0)+(document.body.classList.contains('voc-open')?1:0)+(document.body.classList.contains('vpr-open')?1:0)}catch(e){return 0}};
 const goBack=()=>{try{if(document.body.classList.contains('vpr-open')){closeVprint();return}if(document.body.classList.contains('voc-open')){closeVoc();return}if(T.pres){presOff();return}if(!modal.classList.contains('hidden')){closeModal();return}if(document.getElementById('login').open){closeLogin();return}if(testMode&&(screen==='task'||screen==='tresult')){testMode=false;clearInterval(UT.clk);utBack()}else if(screen==='tprint')renderTheory();else if(screen==='usheet')utBack();else if(screen==='utest'||screen==='tprep')renderHome();else if(screen==='results'||screen==='sheet'||screen==='task')renderPractice();else if(screen==='prac'||screen==='theory'||screen==='slides')renderSetup();else if(screen==='setup')renderHome()}catch(e){}};
 function sync(){
  const want=level();
  while(lv<want){lv++;history.pushState({l:lv},'')}
  if(lv>want){const d=lv-want;lv=want;ign++;history.go(-d)}
 }
 new MutationObserver(sync).observe(document.body,{attributes:true,subtree:true,childList:true,attributeFilter:['class','hidden','style','open']});

<script id="update-notice">
/* Update-Hinweis: meldet unten eine Leiste, sobald die Seite auf dem Server neuer ist. Lädt nie von selbst neu. */
(function(){
  try{
    if(typeof fetch!=='function'||!/^https?:$/.test(location.protocol)||/[?&]demo\b/.test(location.search)||/\/versions\//.test(location.pathname)||window.EMBED_TOPIC||window.self!==window.top)return;
    var base=location.pathname.replace(/[^\/]*$/,'');
    var urls=[location.pathname,base+'sw.js'];
    [].slice.call(document.scripts).forEach(function(s){
      if(!s.src)return;var u=new URL(s.src,location.href);
      if(u.origin===location.origin&&!/\/vendor\//.test(u.pathname)&&urls.indexOf(u.pathname)<0)urls.push(u.pathname);
    });
    function sig(){
      return Promise.all(urls.map(function(u){
        return fetch(u,{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?(r.headers.get('etag')||r.headers.get('last-modified')||''):'';});
      })).then(function(a){return a.join('|');}).catch(function(){return null;});
    }
    var baseSig=null,shown=false,snooze=0;
    function bar(){
      if(shown)return;shown=true;
      var b=document.createElement('div');b.setAttribute('role','status');
      b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483000;max-width:min(94vw,520px);background:#1e293b;color:#fff;border-radius:14px;padding:.7rem .9rem;box-shadow:0 8px 28px rgba(0,0,0,.35);font:600 15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;justify-content:center';
      var t=document.createElement('span');t.textContent='Neue Version verfügbar.';
      var go=document.createElement('button'),later=document.createElement('button'),busy=document.createElement('div');
      var st='border:0;border-radius:10px;padding:.5rem .9rem;font:700 15px system-ui,sans-serif;cursor:pointer;min-height:40px;';
      go.textContent='Jetzt laden';go.style.cssText=st+'background:#38bdf8;color:#0f172a';
      later.textContent='Später';later.style.cssText=st+'background:transparent;color:#cbd5e1';
      busy.style.cssText='flex-basis:100%;font:500 13px system-ui,sans-serif;color:#fde68a;text-align:center';
      try{var m=window.__updateBusy&&window.__updateBusy();if(m)busy.textContent=m;}catch(e){}
      go.onclick=function(){
        go.disabled=true;go.textContent='Lädt …';
        try{window.__updateSave&&window.__updateSave();}catch(e){}
        var done=false,reload=function(){if(done)return;done=true;location.reload();};
        setTimeout(reload,4000);
        Promise.all(urls.map(function(u){return fetch(u,{cache:'reload'}).catch(function(){});})).then(reload,reload);
      };
      later.onclick=function(){b.remove();shown=false;snooze=Date.now()+30*60*1000;};
      b.appendChild(t);b.appendChild(go);b.appendChild(later);b.appendChild(busy);document.body.appendChild(b);
    }
    function check(){
      if(shown||Date.now()<snooze)return;
      sig().then(function(s){
        if(!s||!/[^|]/.test(s))return;
        if(baseSig===null){baseSig=s;return;}
        if(s!==baseSig)bar();
      });
    }
    window.addEventListener('load',function(){setTimeout(check,1500);});
    setInterval(check,5*60*1000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
    window.addEventListener('online',check);
  }catch(e){}
})();
</script>
